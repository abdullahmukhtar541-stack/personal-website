<!doctype html>
<html lang="ps" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075e54"><title>زموږ ملګري | Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#e9edef;color:#17212b}button,input{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;background:#128c7e;color:white;cursor:pointer}button:disabled{opacity:.5}input{width:100%;padding:12px;border:1px solid #dce2e5;border-radius:9px;margin:5px 0}.hidden{display:none!important}.top{background:#075e54;color:white;padding:17px;font-size:20px;font-weight:bold}.auth{max-width:420px;margin:7vh auto;background:white;padding:22px;border-radius:15px}.auth form{display:grid;gap:8px}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;background:#e4efed;color:#075e54}.tabs .on{background:#075e54;color:white}.app{max-width:1100px;height:calc(100vh - 80px);min-height:550px;margin:10px auto;background:white;display:grid;grid-template-columns:320px 1fr;border-radius:12px;overflow:hidden}.side{border-left:1px solid #ddd;display:flex;flex-direction:column}.sidehead{padding:12px;background:#f7f9fa}.sidehead button{margin:3px}.list{overflow:auto}.person{padding:13px;border-bottom:1px solid #eee;cursor:pointer}.person:hover{background:#edf6f5}.muted{font-size:12px;color:#667781}.chat{display:flex;flex-direction:column;min-width:0;background:#efeae2}.chathead{padding:15px;background:#f7f9fa;border-bottom:1px solid #ddd;font-weight:bold}.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:80%;padding:10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.mine{align-self:flex-start;background:#d9fdd3}.other{align-self:flex-end;background:white}.meta{text-align:left;font-size:10px;color:#667781}.ticks{color:#86969c;letter-spacing:-3px}.seen{color:#16a34a}.compose{display:flex;gap:8px;padding:10px;background:#f7f9fa}.compose input{border-radius:22px;margin:0}.compose button{border-radius:50%;width:45px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.modalbox{background:white;border-radius:14px;padding:20px;width:min(420px,100%);max-height:90vh;overflow:auto}.choice{display:block;padding:6px}.choice input{width:auto}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#263238;color:white;padding:10px 16px;border-radius:8px;display:none}
@media(max-width:700px){.app{margin:0;height:calc(100dvh - 58px);border-radius:0;grid-template-columns:1fr}.chat{display:none}.app.open .side{display:none}.app.open .chat{display:flex}.back{display:inline-block!important}}
@media(min-width:701px){.back{display:none!important}}
</style></head><body>
<div class="top">💬 زموږ ملګري <button id="logout" class="hidden" onclick="signOut()" style="float:left;background:#ffffff25">وتل</button></div>
<section id="auth" class="auth">
<h2>ښه راغلاست</h2><p class="muted">له خپلو ملګرو سره شخصي او ګروپي پیغامونه وکړئ.</p>
<div class="tabs"><button id="tabIn" class="on" onclick="authMode('in')">ننوتل</button><button id="tabUp" onclick="authMode('up')">نوی حساب</button></div>
<form id="formIn" onsubmit="login(event)"><input id="emailIn" type="email" placeholder="ایمیل" required><input id="passIn" type="password" placeholder="پاسورډ" required><button>ننوتل</button></form>
<form id="formUp" class="hidden" onsubmit="register(event)"><input id="nameUp" placeholder="نوم" maxlength="70" required><input id="emailUp" type="email" placeholder="ایمیل" required><input id="passUp" type="password" minlength="6" placeholder="پاسورډ (۶ توري یا زیات)" required><button>حساب جوړول</button></form>
<p class="muted">هر ملګری باید خپل حساب جوړ کړي. ایمیل/پاسورډ مه شریکوئ.</p>
</section>
<div id="app" class="app hidden">
<aside class="side"><div class="sidehead"><b id="myName">زما حساب</b><div><button onclick="newGroup()">＋ ګروپ</button><button onclick="switchMode('friends')">ملګري</button><button onclick="switchMode('groups')">ګروپونه</button></div><input id="search" placeholder="لټون..." oninput="renderList()"></div><div id="list" class="list"></div></aside>
<main class="chat"><div class="chathead"><button class="back" onclick="document.getElementById('app').classList.remove('open')">←</button> <span id="chatTitle">چټ انتخاب کړئ</span><div class="muted" id="chatSub">شخصي او ګروپي خبرې</div></div><div id="msgs" class="msgs"><p class="muted">له لېست څخه یو ملګری یا ګروپ انتخاب کړئ.</p></div><form class="compose" onsubmit="sendMsg(event)"><input id="msgText" placeholder="پیغام ولیکئ..." maxlength="4000" disabled><button id="send" disabled>➤</button></form></main>
</div>
<div id="groupModal" class="modal hidden"><div class="modalbox"><h3>نوی ګروپ</h3><form onsubmit="createGroup(event)"><input id="groupName" placeholder="د ګروپ نوم" required maxlength="60"><b>ملګري انتخاب کړئ:</b><div id="choices"></div><button>ګروپ جوړ کړه</button><button type="button" onclick="closeGroup()" style="background:#888">بندول</button></form></div></div>
<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDh0EuKBGWAKWQmoMsq_tIH3-s7rS0tvhE",authDomain:"company-management-syste-bb38b.firebaseapp.com",databaseURL:"https://company-management-syste-bb38b-default-rtdb.firebaseio.com",projectId:"company-management-syste-bb38b",storageBucket:"company-management-syste-bb38b.firebasestorage.app",messagingSenderId:"6882324969",appId:"1:6882324969:web:d914ab21000798b614db78",measurementId:"G-VYTJV8TMMM"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn("offline cache",e.code));
let me=null,people=[],groups=[],mode="friends",active=null,kind=null,peopleOff=null,groupsOff=null,msgOff=null;
const $=id=>document.getElementById(id);
function say(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",3500)}
function authMode(m){$("formIn").classList.toggle("hidden",m!=="in");$("formUp").classList.toggle("hidden",m!=="up");$("tabIn").classList.toggle("on",m==="in");$("tabUp").classList.toggle("on",m==="up")}
function err(e){if(e.code==="permission-denied")return"اجازه نشته؛ Firestore Rules وګورئ.";if(e.code==="auth/email-already-in-use")return"دا ایمیل مخکې ثبت شوی.";return e.message||"ستونزه رامنځته شوه."}
async function register(e){e.preventDefault();try{let c=await auth.createUserWithEmailAndPassword($("emailUp").value.trim(),$("passUp").value);await db.collection("users").doc(c.user.uid).set({uid:c.user.uid,name:$("nameUp").value.trim(),email:c.user.email,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});say("حساب جوړ شو")}catch(x){say(err(x))}}
async function login(e){e.preventDefault();try{await auth.signInWithEmailAndPassword($("emailIn").value.trim(),$("passIn").value)}catch(x){say(err(x))}}
async function signOut(){await auth.signOut()}
function cleanup(){if(peopleOff)peopleOff();if(groupsOff)groupsOff();if(msgOff)msgOff();peopleOff=groupsOff=msgOff=null;active=null;kind=null}
auth.onAuthStateChanged(async u=>{if(!u){cleanup();me=null;$("auth").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden");return}try{let r=db.collection("users").doc(u.uid),s=await r.get();if(!s.exists){await r.set({uid:u.uid,name:u.email.split("@")[0],email:u.email,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});s=await r.get()}me=s.data();$("myName").textContent="👤 "+me.name;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");loadPeople();loadGroups()}catch(e){say(err(e))}});
function loadPeople(){if(peopleOff)peopleOff();peopleOff=db.collection("users").where("active","==",true).onSnapshot(s=>{people=s.docs.map(d=>d.data()).filter(p=>p.uid!==me.uid);renderList();renderChoices()},e=>say(err(e)))}
function loadGroups(){if(groupsOff)groupsOff();groupsOff=db.collection("groups").where("members","array-contains",me.uid).onSnapshot(s=>{groups=s.docs.map(d=>({id:d.id,...d.data()}));renderList()},e=>say(err(e)))}
function switchMode(m){mode=m;renderList()}
function renderList(){let term=$("search").value.toLowerCase(),items=(mode==="friends"?people:groups).filter(x=>(x.name||"").toLowerCase().includes(term));$("list").innerHTML="";if(!items.length){$("list").textContent="تر اوسه څه نشته.";return}items.forEach(x=>{let d=document.createElement("div");d.className="person";d.textContent=(mode==="friends"?"👤 ":"👥 ")+x.name;d.onclick=()=>mode==="friends"?openPrivate(x):openGroup(x);$("list").appendChild(d)})}
async function openPrivate(p){let id=[me.uid,p.uid].sort().join("__"),r=db.collection("privateChats").doc(id);try{let s=await r.get();if(!s.exists)await r.set({members:[me.uid,p.uid].sort(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastMessage:"",updatedAt:firebase.firestore.FieldValue.serverTimestamp()});active={id,name:p.name};kind="private";showChat(p.name,"شخصي چټ");listen(r.collection("messages"))}catch(e){say(err(e))}}
function openGroup(g){active={id:g.id,name:g.name};kind="group";showChat(g.name,"ګروپ");listen(db.collection("groups").doc(g.id).collection("messages"))}
function showChat(n,sub){$("chatTitle").textContent=n;$("chatSub").textContent=sub;$("msgText").disabled=false;$("send").disabled=false;$("app").classList.add("open")}
function listen(ref){if(msgOff)msgOff();$("msgs").innerHTML="";msgOff=ref.orderBy("createdAt","asc").limit(300).onSnapshot(s=>{let box=$("msgs");box.innerHTML="";if(s.empty){box.textContent="د خبرو پیل؛ لومړی پیغام واستوئ.";return}s.forEach(d=>{let m=d.data(),mine=m.senderId===me.uid,b=document.createElement("div");b.className="bubble "+(mine?"mine":"other");if(kind==="group"&&!mine){let n=document.createElement("b");n.textContent=(m.senderName||"ملګری")+"\\n";b.append(n)}let t=document.createElement("span");t.textContent=m.text;b.append(t);let meta=document.createElement("div");meta.className="meta";meta.textContent=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString("ps-AF",{hour:"2-digit",minute:"2-digit"}):"";if(mine){let seen=(m.readBy||[]).some(x=>x!==me.uid),ticks=document.createElement("span");ticks.className="ticks"+(seen?" seen":"");ticks.textContent=" ✓✓";meta.append(ticks)}b.append(meta);box.append(b);if(!mine&&!(m.readBy||[]).includes(me.uid))d.ref.update({readBy:firebase.firestore.FieldValue.arrayUnion(me.uid)}).catch(()=>{})});box.scrollTop=box.scrollHeight},e=>say(err(e)))}
async function sendMsg(e){e.preventDefault();let text=$("msgText").value.trim();if(!text||!active)return;let btn=$("send");btn.disabled=true;try{let r=kind==="private"?db.collection("privateChats").doc(active.id):db.collection("groups").doc(active.id);await r.collection("messages").add({senderId:me.uid,senderName:me.name,text,readBy:[me.uid],createdAt:firebase.firestore.FieldValue.serverTimestamp()});await r.update({lastMessage:text,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});$("msgText").value=""}catch(x){say(err(x))}finally{btn.disabled=false}}
function renderChoices(){$("choices").innerHTML="";people.forEach(p=>{let l=document.createElement("label");l.className="choice";let i=document.createElement("input");i.type="checkbox";i.value=p.uid;let span=document.createElement("span");span.textContent=" "+p.name;l.append(i,span);$("choices").append(l)})}
function newGroup(){renderChoices();$("groupModal").classList.remove("hidden")}function closeGroup(){$("groupModal").classList.add("hidden")}
async function createGroup(e){e.preventDefault();let ids=[...document.querySelectorAll("#choices input:checked")].map(x=>x.value),members=[...new Set([me.uid,...ids])],name=$("groupName").value.trim();if(members.length<2){say("لږ تر لږه یو ملګری انتخاب کړئ.");return}try{let r=await db.collection("groups").add({name,ownerId:me.uid,members,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),lastMessage:""});closeGroup();$("groupName").value="";openGroup({id:r.id,name,members});say("ګروپ جوړ شو")}catch(x){say(err(x))}}
</script></body></html>
